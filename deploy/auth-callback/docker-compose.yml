services:
  auth-callback:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.well-known:/usr/share/nginx/html/.well-known:ro
      - ./oauth:/usr/share/nginx/html/oauth:ro
