server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    autoindex off;
    server_tokens off;

    # No redirects here: Apple and Google both reject redirected association files.
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    # File has no extension, so the type must be forced.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location = /oauth/callback {
        default_type text/html;
        try_files /oauth/callback/index.html =404;
    }

    location / {
        return 404;
    }
}
